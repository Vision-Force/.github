<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30"><title>Vision Force wide section divider</title>
<defs>
  <linearGradient id="dvwCy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#47d1ff"/>
    <stop offset="1" stop-color="#1273ea"/>
  </linearGradient>
  <linearGradient id="dvwVi" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <linearGradient id="dvwBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1a2e"/>
    <stop offset="1" stop-color="#0a1425"/>
  </linearGradient>
  <!-- DYNAMIC BRAND GRADIENT. All three stops share dur 15s so they travel together
       and the ramp never tears. The whole ramp also rotates on a 23s cycle. -->
  <linearGradient id="dvwMark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f6fb">
      <animate attributeName="stop-color"
        values="#f4f6fb;#e9d8ff;#d8f4ff;#ffe4f2;#f4f6fb"
        dur="15s" repeatCount="indefinite"/>
    </stop>
    <stop offset="0.45" stop-color="#a855f7">
      <animate attributeName="stop-color"
        values="#a855f7;#47d1ff;#ff2e4d;#8b5cff;#a855f7"
        dur="15s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#6d28d9">
      <animate attributeName="stop-color"
        values="#6d28d9;#1273ea;#a02bfe;#0ea5b7;#6d28d9"
        dur="15s" repeatCount="indefinite"/>
    </stop>
    <animateTransform attributeName="gradientTransform" type="rotate"
      values="0 0.5 0.5; 360 0.5 0.5" dur="23s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="dvwSpark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9beaff"/>
    <stop offset="0.55" stop-color="#47d1ff"/>
    <stop offset="1" stop-color="#7aa2ff"/>
  </linearGradient>
  <radialGradient id="dvwTop" cx="0.5" cy="0" r="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dvwDots" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="7" r="1.1" fill="#9aa8c4" opacity="0.13"/>
  </pattern>
  <pattern id="dvwDotsFine" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="0.8" fill="#9aa8c4" opacity="0.07"/>
  </pattern>
  <linearGradient id="dvwMaskH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#000000"/>
    <stop offset="0.34" stop-color="#3a3a3a"/>
    <stop offset="0.72" stop-color="#c8c8c8"/>
    <stop offset="1"    stop-color="#ffffff"/>
  </linearGradient>
  <mask id="dvwFadeR" maskContentUnits="objectBoundingBox">
    <rect x="0" y="0" width="1" height="1" fill="url(#dvwMaskH)"/>
  </mask>
  <filter id="dvwSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="dvwSoftTight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6"/>
  </filter>
</defs>

<!-- BASELINE: the dashed hairline, inset 70 from each end, with a slow crawl. -->
<line x1="70" y1="15" x2="1130" y2="15" stroke="#4a6f96" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.55">
  <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="4.6s" repeatCount="indefinite"/>
</line>

<!-- CHARGE RAIL over the centre third. The static #2a4a78 rail is omitted here because
     the dashed baseline already occupies that role. Wide faint under, thin bright over. -->
<path d="M430 15H770" fill="none" stroke="url(#dvwSpark)" stroke-width="5.5" opacity="0.22"
      stroke-dasharray="4 32" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.4s" repeatCount="indefinite"/>
</path>
<path d="M430 15H770" fill="none" stroke="url(#dvwSpark)" stroke-width="2" opacity="0.95"
      stroke-dasharray="4 32" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- NODE PULSES at each end of the rail. The right node fires first. -->
<g transform="translate(770,15)">
  <circle r="3" fill="#47d1ff" opacity="0">
    <animate attributeName="opacity" values="0.3;0;0" dur="2.4s" keyTimes="0;0.2;1" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;9;9" dur="2.4s" keyTimes="0;0.2;1" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="none" stroke="#47d1ff" stroke-width="1" opacity="0.32">
    <animate attributeName="opacity" values="0.9;0.32;0.32" dur="2.4s" keyTimes="0;0.2;1" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#9beaff" opacity="0.55">
    <animate attributeName="opacity" values="1;0.55;0.55" dur="2.4s" keyTimes="0;0.2;1" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.9;2;2" dur="2.4s" keyTimes="0;0.2;1" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</g>
<g transform="translate(430,15)">
  <circle r="3" fill="#47d1ff" opacity="0">
    <animate attributeName="opacity" values="0.3;0;0" dur="2.4s" keyTimes="0;0.2;1" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;9;9" dur="2.4s" keyTimes="0;0.2;1" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="none" stroke="#47d1ff" stroke-width="1" opacity="0.32">
    <animate attributeName="opacity" values="0.9;0.32;0.32" dur="2.4s" keyTimes="0;0.2;1" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#9beaff" opacity="0.55">
    <animate attributeName="opacity" values="1;0.55;0.55" dur="2.4s" keyTimes="0;0.2;1" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.9;2;2" dur="2.4s" keyTimes="0;0.2;1" begin="1.2s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- LAYER 1: far. Slowest, closed orbit out to the upper right and home underneath.
     Biased above the start point because this layer carries the lowest plusses and
     the strip is only 30 tall. -->
<g>
  <animateMotion dur="31s" repeatCount="indefinite"
    path="M0,0 C 4,-2.6 11,-3.2 13,-2.2 C 15,-1.2 10,-0.2 4,-0.4 C -2,-0.6 -4,-0.4 0,0 Z"/>
  <path d="M199.5 25.3H205.9M202.7 22.1V28.5" stroke="#6ea8dc" stroke-width="1.7" stroke-linecap="round" opacity="0.33"/>
  <g transform="translate(224.8,14.9)">
    <animateMotion dur="11s" begin="0.6s" repeatCount="indefinite"
      path="M0,0 C 2.4,-1.2 6,-0.8 6,1.2 C 6,3.2 2.4,3.6 0,2.6 C -2.4,1.6 -2.4,0.8 0,0 Z"/>
    <path d="M-3 0H3M0 -3V3" stroke="#8b5cff" stroke-width="1.6" stroke-linecap="round" opacity="0.27"/>
  </g>
  <path d="M653.6 5.6H660.2M656.9 2.3V8.9" stroke="#3b82f6" stroke-width="1.7" stroke-linecap="round" opacity="0.36"/>
  <path d="M1001.2 25.4H1007.4M1004.3 22.3V28.5" stroke="#6ea8dc" stroke-width="1.6" stroke-linecap="round" opacity="0.29"/>
  <g transform="translate(1027.9,5.4)">
    <animateMotion dur="9.5s" begin="5.2s" repeatCount="indefinite"
      path="M0,0 C 3,1.4 6,1 6,-1 C 6,-3 2.4,-3.4 -0.6,-2.4 C -3.6,-1.4 -2.4,-0.8 0,0 Z"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="24s" repeatCount="indefinite" additive="sum"/>
    <path d="M-3.4 0H3.4M0 -3.4V3.4" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.14;0.4" dur="5.1s" begin="3.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M71.5 10.6H77.5M74.5 7.6V13.6" stroke="#47d1ff" stroke-width="1.6" stroke-linecap="round" opacity="0.24"/>
  <path d="M296.9 12.8H303.5M300.2 9.5V16.1" stroke="#a855f7" stroke-width="1.7" stroke-linecap="round" opacity="0.37">
    <animate attributeName="opacity" values="0.37;0.13;0.37" dur="4.6s" begin="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M352.8 23.7H359M355.9 20.6V26.8" stroke="#8b5cff" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
  <g transform="translate(540.4,25.6)">
    <animateMotion dur="12s" begin="2.9s" repeatCount="indefinite"
      path="M0,0 C -2.6,-1.4 -6,-1 -6,0.6 C -6,2.2 -2.6,2.6 -0.4,1.6 C 1.8,0.6 1.6,0.4 0,0 Z"/>
    <path d="M-3.2 0H3.2M0 -3.2V3.2" stroke="#47d1ff" stroke-width="1.7" stroke-linecap="round" opacity="0.34"/>
  </g>
  <path d="M889.6 9.1H895.6M892.6 6.1V12.1" stroke="#6ea8dc" stroke-width="1.6" stroke-linecap="round" opacity="0.23">
    <animate attributeName="opacity" values="0.23;0.08;0.23" dur="6.4s" begin="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M1122.6 17.9H1129.4M1126 14.5V21.3" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
</g>

<!-- LAYER 2: mid. Medium speed, a larger orbit running the OPPOSITE way round:
     out to the left and down, home along the top. -->
<g>
  <animateMotion dur="22s" repeatCount="indefinite"
    path="M0,0 C -6,1.6 -14,1.8 -16,0.4 C -18,-1 -13,-3.2 -6,-3 C 1,-2.8 3,-1.2 0,0 Z"/>
  <path d="M182.9 19.8H190.9M186.9 15.8V23.8" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M227.7 6.7H235.1M231.4 3V10.4" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.48">
    <animate attributeName="opacity" values="0.48;0.17;0.48" dur="3.9s" begin="1.3s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(648.5,9.6)">
    <animateMotion dur="8.5s" begin="1.4s" repeatCount="indefinite"
      path="M0,0 C -2.4,1.2 -6,0.8 -6,-1 C -6,-2.8 -2.4,-3.2 0,-2.2 C 2.4,-1.2 2.4,-0.6 0,0 Z"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="27s" repeatCount="indefinite" additive="sum"/>
    <path d="M-4.2 0H4.2M0 -4.2V4.2" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.22;0.6" dur="5.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M680.1 24.1H687.3M683.7 20.5V27.7" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.44"/>
  <path d="M989.3 21.6H997.1M993.2 17.7V25.5" stroke="#47d1ff" stroke-width="2.1" stroke-linecap="round" opacity="0.52">
    <animate attributeName="opacity" values="0.52;0.19;0.52" dur="7.5s" begin="4.2s" repeatCount="indefinite"/>
  </path>
  <path d="M1037.4 13.2H1045.6M1041.5 9.1V17.3" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" opacity="0.58"/>
  <path d="M124.8 8.4H131.8M128.3 4.9V11.9" stroke="#47d1ff" stroke-width="1.9" stroke-linecap="round" opacity="0.41"/>
  <path d="M398.8 22.4H406.4M402.6 18.6V26.2" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M482.1 7.2H490.1M486.1 3.2V11.2" stroke="#47d1ff" stroke-width="2.1" stroke-linecap="round" opacity="0.57">
    <animate attributeName="opacity" values="0.57;0.2;0.57" dur="6.4s" begin="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M824.8 17.5H832M828.4 13.9V21.1" stroke="#3b82f6" stroke-width="1.9" stroke-linecap="round" opacity="0.43"/>
</g>

<!-- LAYER 3: near. Fastest and widest, a third direction again: out low to the right,
     home high across the top. Nothing in this file ever reverses through its start. -->
<g>
  <animateMotion dur="15s" repeatCount="indefinite"
    path="M0,0 C 7,2.2 16,2.8 21,1.2 C 26,-0.6 20,-3.4 11,-3.6 C 2,-3.8 -6,-1.6 0,0 Z"/>
  <g transform="translate(96.8,19.4)">
    <animateMotion dur="7.5s" begin="3.6s" repeatCount="indefinite"
      path="M0,0 C 3,1.6 7,1.2 7,-1 C 7,-3.2 3,-3.6 -0.6,-2.4 C -4.2,-1.2 -3,-0.8 0,0 Z"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="22s" repeatCount="indefinite" additive="sum"/>
    <path d="M-4.3 0H4.3M0 -4.3V4.3" stroke="#8b5cff" stroke-width="2.4" stroke-linecap="round" opacity="0.61">
      <animate attributeName="opacity" values="0.61;0.22;0.61" dur="5.1s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(213.6,11.4)">
    <animateMotion dur="10.5s" repeatCount="indefinite"
      path="M0,0 C -3,-1.6 -7,-1.2 -7,1 C -7,3.2 -3,3.6 0.6,2.4 C 4.2,1.2 3,0.8 0,0 Z"/>
    <path d="M-4.8 0H4.8M0 -4.8V4.8" stroke="#e8eefb" stroke-width="2.7" stroke-linecap="round" opacity="0.84"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1.12;1" dur="6.7s" begin="1.8s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="25s" repeatCount="indefinite" additive="sum"/>
  </g>
  <path d="M659.7 20.3H668.7M664.2 15.8V24.8" stroke="#47d1ff" stroke-width="2.5" stroke-linecap="round" opacity="0.66">
    <animate attributeName="opacity" values="0.66;0.24;0.66" dur="3.2s" begin="5s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(1012.7,8.9)">
    <animateMotion dur="12s" begin="4.8s" repeatCount="indefinite"
      path="M0,0 C 2.6,-1.6 6.4,-1.2 6.4,0.8 C 6.4,2.8 2.6,3.4 0,2.4 C -2.6,1.4 -2.4,0.8 0,0 Z"/>
    <path d="M-4.9 0H4.9M0 -4.9V4.9" stroke="#a855f7" stroke-width="2.7" stroke-linecap="round" opacity="0.74"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1.22;1" dur="6.2s" begin="2.4s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="29s" repeatCount="indefinite" additive="sum"/>
  </g>
  <!-- HERO PLUS: the exact midpoint, x 600 of 1200. It carries the dynamic brand
       gradient here, so the two divider variants stay distinguishable at a glance. -->
  <g transform="translate(600,15)">
    <animateMotion dur="14s" begin="1.1s" repeatCount="indefinite"
      path="M0,0 C -2.6,1.4 -6.4,1 -6.4,-1 C -6.4,-3 -2.6,-3.4 0,-2.4 C 2.6,-1.4 2.4,-0.8 0,0 Z"/>
    <path d="M-5.1 0H5.1M0 -5.1V5.1" stroke="url(#dvwMark)" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1.18;1" dur="5.9s" begin="0.4s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="31s" repeatCount="indefinite" additive="sum"/>
  </g>
</g>
</svg>
