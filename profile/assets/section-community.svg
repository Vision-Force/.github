<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
<title>The Community section band</title>
<defs><linearGradient id="cmCy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#47d1ff"/><stop offset="1" stop-color="#1273ea"/></linearGradient><linearGradient id="cmVi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="cmBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a2e"/><stop offset="1" stop-color="#0a1425"/></linearGradient><linearGradient id="cmSpark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9beaff"/><stop offset="0.55" stop-color="#47d1ff"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient>
<!-- dynamic brand gradient for the winged bolt watermark, slowed so it never competes with the headline -->
<linearGradient id="cmMark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fb"><animate attributeName="stop-color" values="#f4f6fb;#e9d8ff;#d8f4ff;#ffe4f2;#f4f6fb" dur="34s" repeatCount="indefinite"/></stop><stop offset="0.45" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#47d1ff;#ff2e4d;#8b5cff;#a855f7" dur="34s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#6d28d9"><animate attributeName="stop-color" values="#6d28d9;#1273ea;#a02bfe;#0ea5b7;#6d28d9" dur="34s" repeatCount="indefinite"/></stop><animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5; 360 0.5 0.5" dur="34s" repeatCount="indefinite"/></linearGradient>
<!-- travelling colour for the second word of the wordmark -->
<linearGradient id="cmWord" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#8b5cff;#47d1ff;#a855f7" dur="11s" repeatCount="indefinite"/></stop><stop offset="0.5" stop-color="#c9a6ff"><animate attributeName="stop-color" values="#c9a6ff;#7fe3ff;#c9a6ff;#c9a6ff" dur="11s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8b5cff"><animate attributeName="stop-color" values="#8b5cff;#47d1ff;#a855f7;#8b5cff" dur="11s" repeatCount="indefinite"/></stop><animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5; 360 0.5 0.5" dur="29s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="cmTop" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><pattern id="cmDots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1.1" fill="#9aa8c4" opacity="0.13"/></pattern><pattern id="cmDotsFine" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="0.8" fill="#9aa8c4" opacity="0.07"/></pattern><linearGradient id="cmMaskH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000000"/><stop offset="0.34" stop-color="#3a3a3a"/><stop offset="0.72" stop-color="#c8c8c8"/><stop offset="1" stop-color="#ffffff"/></linearGradient><mask id="cmFadeR" maskContentUnits="objectBoundingBox"><rect x="0" y="0" width="1" height="1" fill="url(#cmMaskH)"/></mask><filter id="cmSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter><filter id="cmSoftTight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
<clipPath id="cmClip"><rect x="0" y="0" width="1200" height="130" rx="14"/></clipPath>
