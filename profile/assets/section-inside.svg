<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
<title>The Method section band</title>
<defs><linearGradient id="inCy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#47d1ff"/><stop offset="1" stop-color="#1273ea"/></linearGradient><linearGradient id="inVi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="inBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a2e"/><stop offset="1" stop-color="#0a1425"/></linearGradient><linearGradient id="inSpark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9beaff"/><stop offset="0.55" stop-color="#47d1ff"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient>
<!-- dynamic brand gradient for the winged bolt watermark, slowed so it never competes with the headline -->
<linearGradient id="inMark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fb"><animate attributeName="stop-color" values="#f4f6fb;#e9d8ff;#d8f4ff;#ffe4f2;#f4f6fb" dur="34s" repeatCount="indefinite"/></stop><stop offset="0.45" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#47d1ff;#ff2e4d;#8b5cff;#a855f7" dur="34s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#6d28d9"><animate attributeName="stop-color" values="#6d28d9;#1273ea;#a02bfe;#0ea5b7;#6d28d9" dur="34s" repeatCount="indefinite"/></stop><animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5; 360 0.5 0.5" dur="34s" repeatCount="indefinite"/></linearGradient>
<!-- travelling colour for the second word of the wordmark -->
